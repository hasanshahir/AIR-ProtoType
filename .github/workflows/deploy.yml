name: Deploy AIR ProtoType to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build AIR-Proto-v2 (Prototype 2)
        working-directory: AIR-Proto-v2
        run: |
          npm ci
          npm run build

      - name: Install & Build AIR-proto-master (Ali's Prototype)
        working-directory: AIR-proto-master
        run: |
          npm ci
          npm run build

      - name: Package Both Prototypes for Deployment
        run: |
          mkdir -p AIR-Proto-v2/dist/proto-master
          mkdir -p AIR-Proto-v2/dist/AIR-proto
          cp -r AIR-proto-master/dist/* AIR-Proto-v2/dist/proto-master/
          cp -r AIR-proto-master/dist/* AIR-Proto-v2/dist/AIR-proto/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'AIR-Proto-v2/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
